<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เช็กพื้นที่ห่างไกล | FASTEST LAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E10600;--red-dark:#B30500;--red-soft:#FDECEC;--black:#111;--ink:#222;--gray-1:#F4F4F4;--gray-2:#E6E6E6;--gray-3:#BDBDBD;--gray-4:#7A7A7A;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--white)}
body{font-family:'Bai Jamjuree',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 24px}
button{font-family:inherit}
.hero{background:var(--black);color:var(--white);border-bottom:4px solid var(--red);border-radius:0 0 18px 18px;padding:26px 20px 22px;margin:0 -16px}
@media(min-width:792px){.hero{border-radius:18px;margin:16px 0 0}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--red)}
.hero h1{margin:4px 0 6px;font-size:28px;line-height:1.25;font-weight:700}
.hero h1 span{color:var(--red)}
.hero p{margin:0;color:#BDBDBD;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:#1E1E1E;border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.stat small{font-size:12px;color:#9E9E9E}
.search{position:relative;margin-top:18px}
.search-box{display:flex;align-items:center;gap:10px;border:2px solid var(--black);border-radius:14px;padding:0 8px 0 14px;height:56px;background:var(--white);transition:border-color .15s}
.search-box:focus-within{border-color:var(--red)}
.search-box svg{flex:none;color:var(--gray-4)}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:18px;color:var(--black);height:52px}
.search-box input::placeholder{color:var(--gray-3)}
.search-box input::-webkit-search-cancel-button,.search-box input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.clear{flex:none;border:0;background:var(--gray-1);color:var(--gray-4);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;display:none}
.clear.show{display:block}
.hint{font-size:12px;color:var(--gray-4);margin:6px 2px 0}
#results{margin-top:14px}
.card{border-radius:14px;padding:16px;margin-bottom:10px}
.card.hit{background:var(--red);color:var(--white)}
.card.ok{background:var(--gray-1);color:var(--black)}
.card .head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.card .zip{font-size:30px;font-weight:700;line-height:1.1;margin-top:8px;letter-spacing:.5px}
.card .loc{font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--black);color:var(--white);margin-left:auto;white-space:nowrap}
.fee{margin-top:12px;background:var(--white);color:var(--black);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.fee b{color:var(--red);font-size:16px}
.tlabel{font-size:12px;margin-top:12px;color:#FFD4D2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18);color:var(--white)}
.tag.m{background:var(--white);color:var(--red-dark);font-weight:600}
.note{font-size:12px;margin-top:10px;color:#FFD4D2}
.ok .sub{font-size:13px;color:var(--gray-4);margin-top:4px}
.more{font-size:13px;color:var(--gray-4);text-align:center;padding:4px 0 8px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--gray-2);background:var(--white);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;font-size:13px;color:var(--ink)}
.sugg button b{color:var(--red);font-size:15px;display:block}
.empty{font-size:14px;color:var(--gray-4);padding:4px 2px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px}
.list-head h2{margin:0;font-size:18px;font-weight:600;color:var(--black)}
.list-head small{font-size:12px;color:var(--gray-4)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--gray-2);background:var(--white);color:var(--gray-4);font-size:13px;cursor:pointer}
.chip.on{background:var(--black);color:var(--white);border-color:var(--black)}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.prov{border:1px solid var(--gray-2);border-radius:12px;margin-bottom:8px;overflow:hidden}
.prov>button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border:0;background:var(--white);cursor:pointer;font-size:15px;font-weight:600;color:var(--black);text-align:left}
.prov>button small{font-weight:400;color:var(--gray-4);font-size:12px;margin-left:6px}
.chev{transition:transform .2s;color:var(--gray-3);flex:none}
.prov.open .chev{transform:rotate(180deg)}
.prov .body{display:none;border-top:1px solid var(--gray-2)}
.prov.open .body{display:block}
.amp{padding:10px 14px;border-bottom:1px solid var(--gray-1)}
.amp:last-child{border-bottom:0}
.amp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.amp-top .z{font-weight:700;color:var(--red);font-size:15px}
.amp-top .n{font-size:14px;color:var(--black)}
.amp-top .t{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gray-1);color:var(--gray-4);margin-left:auto}
.amp-top .t.tour{background:var(--black);color:var(--white)}
.amp .tags{margin-top:6px}
.amp .tag{background:var(--red-soft);color:var(--red-dark)}
</style>
</head>

  </div>
  <div id="results" aria-live="polite"></div>

  <div class="list-head"><h2>รายการพื้นที่ทั้งหมด</h2><small id="cnt"></small></div>

</div>

"ถลาง","เทพกระษัตรี","83110","Thep Krasattri/Thalang/Phuket"],[1,"ภูเก็ต","ถลาง","ไม้ขาว","83110","Mai Khao/Thalang/Phuket"],[1,"ภูเก็ต","ถลาง","สาคู","83110","Sakhu/Thalang/Phuket"],[1,"ภูเก็ต","กะทู้","กะทู้","83120","Kathu/Kathu/Phuket"],[1,"ภูเก็ต","กะทู้","กมลา","83120","Kamala/Kathu/Phuket"],[1,"ภูเก็ต","เมืองภูเก็ต","ราไวย์","83130","Rawai/Mueang Phuket/Phuket"],[1,"ภูเก็ต","เมืองภูเก็ต","ฉลอง","83130","Chalong/Mueang Phuket/Phuket"],[1,"ภูเก็ต","กะทู้","ป่าตอง","83150","Pa Tong/Kathu/Phuket"],[1,"ภูเก็ต","กะทู้","กะทู้","83150","Kathu/Kathu/Phuket"],[1,"ภูเก็ต","กะทู้","กมลา","83150","Kamala/Kathu/Phuket"],[1,"สุราษฎร์ธานี","เกาะสมุย","ลิปะน้อย","84140","Lipa Noi/Ko Samui/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะสมุย","หน้าเมือง","84140","Na Mueang/Ko Samui/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะสมุย","ตลิ่งงาม","84140","Taling Ngam/Ko Samui/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะสมุย","อ่างทอง","84140","Ang Thong/Ko Samui/Surat Thani"],[1,"สุราษฎร์ธานี","ดอนสัก","ดอนสัก","84220","Don Sak/Don Sak/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะสมุย","อ่างทอง","84220","Ang Thong/Ko Samui/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะพะงัน","เกาะพะงัน","84280","Ko Pha-ngan/Ko Pha-ngan/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะพะงัน","บ้านใต้","84280","Ban Tai/Ko Pha-ngan/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะสมุย","มะเร็ต","84310","Maret/Ko Samui/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะสมุย","บ่อผุด","84320","Bo Phut/Ko Samui/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะสมุย","แม่น้ำ","84330","Mae Nam/Ko Samui/Surat Thani"],[1,"สุราษฎร์ธานี","เกาะพะงัน","เกาะเต่า","84360","Ko Tao/Ko Pha-ngan/Surat Thani"],[1,"ระนอง","เมืองระนอง","ปากน้ำ","85000","Pak Nam/Mueang Ranong/Ranong"],[1,"ระนอง","เมืองระนอง","เกาะพยาม","85000","Ko Phayam/Mueang Ranong/Ranong"],[1,"สตูล","เมืองสตูล","ปูยู","91000","Puyu/Mueang Satun/Satun"],[1,"สตูล","เมืองสตูล","เกาะสาหร่าย","91000","Ko Sarai/Mueang Satun/Satun"],[1,"สตูล","เมืองสตูล","ตำมะลัง","91000","Tam Malang/Mueang Satun/Satun"],[1,"ตรัง","กันตัง","เกาะลิบง","92110","Ko Libong/Kantang/Trang"],[1,"ตรัง","ปะเหลียน","เกาะสุกร","92120","Ko Sukon/Palian/Trang"]]; /* [typeIdx, จังหวัด, อำเภอ, ตำบล, รหัสไปรษณีย์, ชื่ออังกฤษ] */
const D = RAW.map(r => ({ type: TYPES[r[0]], prov: r[1], amp: r[2], tam: r[3], zip: r[4], en: (r[5] || '').toLowerCase() }));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thaiDigits = s => s.replace(/[๐-๙]/g, d => '๐๑๒๓๔๕๖๗๘๙'.indexOf(d));
const norm = s => thaiDigits(s).trim().toLowerCase()
  .replace(/^(จังหวัด|จ\.|อำเภอ|อ\.|เขต|ตำบล|ต\.|แขวง)\s*/, '').replace(/\s+/g, ' ');

/* group by zip + amphoe + type */
function group(rows) {
  const m = new Map();
  rows.forEach(r => {
    const k = r.zip + '|' + r.prov + '|' + r.amp + '|' + r.type;
    if (!m.has(k)) m.set(k, { zip: r.zip, prov: r.prov, amp: r.amp, type: r.type, tams: [] });
    m.get(k).tams.push(r.tam);
  });
  return [...m.values()];
}
const ALL = group(D);

$('sZip').textContent = new Set(D.map(r => r.zip)).size;
$('sTam').textContent = D.length;
$('sProv').textContent = new Set(D.map(r => r.prov)).size;

const alertIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
const okIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>';

function hitCard(g, s, byZip) {
  const fee = FEES[g.type];
  const tags = g.tams.map(t => `<span class="tag ${s && !byZip && t.toLowerCase().includes(s) ? 'm' : ''}">ต.${esc(t)}</span>`).join('');
  return `<div class="card hit">
    <div class="head">${alertIcon}อยู่ในพื้นที่มีค่าส่งเพิ่ม<span class="badge">${esc(g.type)}</span></div>
    <div class="zip">${esc(g.zip)}</div>
    <div class="loc">อ.${esc(g.amp)} จ.${esc(g.prov)}</div>
    ${fee ? `<div class="fee"><span>ค่าจัดส่งเพิ่มเติม</span><b>${esc(fee)}</b></div>` : ''}
    <div class="tlabel">ตำบลที่มีค่าส่งเพิ่ม (${g.tams.length})</div>
    <div class="tags">${tags}</div>
    ${byZip ? '<div class="note">หากตำบลของคุณไม่อยู่ในรายการนี้ ส่งได้ตามปกติ</div>' : ''}
  </div>`;
}

function search() {
  const raw = $('q').value;
  $('clr').classList.toggle('show', raw.length > 0);
  const s = norm(raw);
  const box = $('results');
  if (!s) { box.innerHTML = ''; return; }

  if (/^\d+$/.test(s)) {
    if (s.length >= 5) {
      const z = s.slice(0, 5);
      const hits = ALL.filter(g => g.zip === z);
      box.innerHTML = hits.length
        ? hits.map(g => hitCard(g, '', true)).join('')
        : `<div class="card ok"><div class="head">${okIcon}${esc(z)} ส่งได้ตามปกติ</div><div class="sub">ไม่อยู่ในรายการพื้นที่ห่างไกล ไม่มีค่าจัดส่งเพิ่มเติม</div></div>`;
      return;
    }
    const zs = [...new Set(ALL.filter(g => g.zip.startsWith(s)).map(g => g.zip))];
    if (!zs.length) { box.innerHTML = `<div class="empty">พิมพ์รหัสให้ครบ 5 หลัก</div>`; return; }
    const show = zs.slice(0, 8);
    box.innerHTML = `<div class="empty" style="margin-bottom:8px">รหัสที่อยู่ในรายการ (แตะเพื่อดู)</div><div class="sugg">${show.map(z => {
      const g = ALL.find(x => x.zip === z);
      return `<button data-z="${z}"><b>${z}</b>อ.${esc(g.amp)} จ.${esc(g.prov)}</button>`;
    }).join('')}</div>${zs.length > show.length ? `<div class="more">และอีก ${zs.length - show.length} รหัส พิมพ์เพิ่มเพื่อเจาะจง</div>` : ''}`;
    return;
  }

  if (s.length < 2) { box.innerHTML = `<div class="empty">พิมพ์อย่างน้อย 2 ตัวอักษร</div>`; return; }
  const rows = D.filter(r => r.tam.toLowerCase().includes(s) || r.amp.toLowerCase().includes(s) || r.prov.toLowerCase().includes(s) || r.en.includes(s));
  if (!rows.length) {
    box.innerHTML = `<div class="card ok"><div class="head">${okIcon}ไม่พบ “${esc(raw.trim())}” ในรายการ</div><div class="sub">พื้นที่นี้ส่งได้ตามปกติ หากไม่แน่ใจ ลองค้นด้วยรหัสไปรษณีย์</div></div>`;
    return;
  }
  /* show all tambons of each matching group, highlight the matched ones */
  const keys = new Set(rows.map(r => r.zip + '|' + r.prov + '|' + r.amp + '|' + r.type));
  const groups = ALL.filter(g => keys.has(g.zip + '|' + g.prov + '|' + g.amp + '|' + g.type));
  const LIMIT = 5;
  box.innerHTML = groups.slice(0, LIMIT).map(g => hitCard(g, s, false)).join('') +
    (groups.length > LIMIT ? `<div class="more">พบอีก ${groups.length - LIMIT} พื้นที่ พิมพ์ให้เจาะจงขึ้น หรือดูในรายการด้านล่าง</div>` : '');
}

$('q').addEventListener('input', search);
$('clr').addEventListener('click', () => { $('q').value = ''; search(); $('q').focus(); });
$('results').addEventListener('click', e => {
  const b = e.target.closest('[data-z]');
  if (b) { $('q').value = b.dataset.z; search(); }
});

/* list */
let filter = 'ทั้งหมด';
const openProv = new Set();
function drawList() {
  const opts = ['ทั้งหมด', ...TYPES];
  $('chips').innerHTML = opts.map(o => {
    const n = o === 'ทั้งหมด' ? D.length : D.filter(r => r.type === o).length;
    return `<button class="chip ${o === filter ? 'on' : ''}" data-f="${esc(o)}">${esc(o)}<i>${n}</i></button>`;
  }).join('');
  const gs = ALL.filter(g => filter === 'ทั้งหมด' || g.type === filter);
  const byProv = new Map();
  gs.forEach(g => { if (!byProv.has(g.prov)) byProv.set(g.prov, []); byProv.get(g.prov).push(g); });
  const provs = [...byProv.keys()].sort((a, b) => a.localeCompare(b, 'th'));
  $('cnt').textContent = `${provs.length} จังหวัด · ${new Set(gs.map(g => g.zip)).size} รหัส`;
  $('list').innerHTML = provs.map(p => {
    const items = byProv.get(p).sort((a, b) => a.zip.localeCompare(b.zip) || a.amp.localeCompare(b.amp, 'th'));
    const tc = items.reduce((n, g) => n + g.tams.length, 0);
    return `<div class="prov ${openProv.has(p) ? 'open' : ''}" data-p="${esc(p)}">
      <button aria-expanded="${openProv.has(p)}"><span>${esc(p)}<small>${tc} ตำบล</small></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="body">${items.map(g => `<div class="amp"><div class="amp-top"><span class="z">${esc(g.zip)}</span><span class="n">อ.${esc(g.amp)}</span><span class="t ${g.type !== TYPES[0] ? 'tour' : ''}">${esc(g.type)}</span></div><div class="tags">${g.tams.map(t => `<span class="tag">ต.${esc(t)}</span>`).join('')}</div></div>`).join('')}</div>
    </div>`;
  }).join('');
}
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; drawList(); } });
$('list').addEventListener('click', e => {
  const b = e.target.closest('.prov > button'); if (!b) return;
  const p = b.parentElement.dataset.p;
  openProv.has(p) ? openProv.delete(p) : openProv.add(p);
  b.parentElement.classList.toggle('open');
  b.setAttribute('aria-expanded', openProv.has(p));
});
drawList();

/* auto-height for iframe embed */
function postHeight() {
  try { parent.postMessage({ type: 'fl-remote-height', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
}
if ('ResizeObserver' in window) new ResizeObserver(postHeight).observe(document.body);
window.addEventListener('load', postHeight);
</script>
